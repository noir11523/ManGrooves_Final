project_id = "mangrooves"

[functions.api]
# The API has public configuration/registration routes. Every protected route
# validates the user with Auth AND checks its live database role/session.
verify_jwt = false

[auth]
site_url = "https://mangrooves-php.vercel.app"
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
otp_length = 6
otp_expiry = 600
max_frequency = "60s"

[auth.email.template.confirmation]
subject = "Your ManGROOVES sign-up code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.magic_link]
subject = "Your ManGROOVES email code"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Your ManGROOVES password reset code"
content_path = "./supabase/templates/recovery.html"

[storage]
file_size_limit = "5MiB"
